name: ci

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Java
        id: setup-jre
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Compile
        run: ./gradlew compileJava

  test:
    needs: [ compile ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Java
        id: setup-jre
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Test
        run: ./gradlew test
