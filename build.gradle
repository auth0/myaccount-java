plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.diffplug.spotless' version '6.11.0'
}

repositories {
    mavenCentral()
    maven {
        url 'https://s01.oss.sonatype.org/content/repositories/releases/'
    }
}

dependencies {
    api 'com.squareup.okhttp3:okhttp:5.4.0'
    api 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.22.1'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.14.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.4.0'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:5.4.0'
}


sourceCompatibility = 1.8
targetCompatibility = 1.8

tasks.withType(Javadoc) {
    failOnError false
    options.addStringOption('Xdoclint:none', '-quiet')
}

spotless {
    java {
        palantirJavaFormat()
    }
}


java {
    withSourcesJar()
    withJavadocJar()
}


test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
}

